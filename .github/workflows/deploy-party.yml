name: Deploy game server

# Auto-deploys party/ to Cloudflare whenever the server code or this
# workflow changes. The first deploy and the ADMIN_TOKEN secret are done
# locally (see party/README.md) — this handles every push after that.
#
# Setup (one-time, in GitHub repo Settings -> Secrets -> Actions):
#   CLOUDFLARE_API_TOKEN  = token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID = shown on the Cloudflare dashboard
on:
  push:
    branches: [main]
    paths:
      - "party/**"
      - ".github/workflows/deploy-party.yml"
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: party
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repo secrets."
            exit 1
          fi
          npx wrangler deploy
